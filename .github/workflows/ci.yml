name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax (every script and module)
        run: |
          status=0
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --check "$f" || status=1
          done
          exit $status
      - name: Run focus and garden unit tests
        run: node --test tests/*.test.mjs
