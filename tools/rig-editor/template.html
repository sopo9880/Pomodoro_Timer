<title>Bloomodoro 리그 조립대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Workbench: the character stage takes the left, a field-notebook panel of parts and dials on the right. */
:root{
  --paper:#eef0e2; --sheet:#f8f8ef; --ink:#2f3127; --ink-soft:#5d6250; --line:rgba(47,49,39,.14);
  --moss:#55703a; --moss-wash:#dfe7cc; --brass:#a67c2e; --stage-a:#cfe0b8; --stage-b:#b7cc9a; --guide:rgba(47,60,30,.22);
  --sel:#d9572b;
  --display:"Gowun Batang",Georgia,serif; --body:"Gowun Dodum",system-ui,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1d221a; --sheet:#262c22; --ink:#e7ead9; --ink-soft:#a9b097; --line:rgba(231,234,217,.14);
  --moss:#9cbc72; --moss-wash:#33402a; --brass:#d3a955; --stage-a:#3a4a2e; --stage-b:#2c3a23; --guide:rgba(220,235,190,.2); --sel:#ff8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1d221a; --sheet:#262c22; --ink:#e7ead9; --ink-soft:#a9b097; --line:rgba(231,234,217,.14);
  --moss:#9cbc72; --moss-wash:#33402a; --brass:#d3a955; --stage-a:#3a4a2e; --stage-b:#2c3a23; --guide:rgba(220,235,190,.2); --sel:#ff8a5c; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
*{box-sizing:border-box}
h1{font-family:var(--display);font-size:1.35rem;margin:0;text-wrap:balance}
.top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.top p{margin:0;color:var(--ink-soft)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;height:calc(100% - 52px);min-height:560px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(var(--stage-a),var(--stage-b));border:1px solid var(--line);min-height:420px}
#stage{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
.hint{position:absolute;left:12px;bottom:10px;max-width:calc(100% - 24px);font-size:12px;color:var(--ink-soft);pointer-events:none;background:var(--sheet);border-radius:999px;padding:3px 10px;opacity:.92}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-width:0}
.label{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper);padding:4px;border-radius:999px}
.seg button{border:0;background:none;border-radius:999px;padding:.4em 0;font:inherit;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:.3em .8em;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--sheet)}
.parts{display:flex;flex-wrap:wrap;gap:5px}
.parts button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.3em .6em;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;position:relative}
.parts button[aria-pressed="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.parts button.changed::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.dials{display:grid;gap:10px;padding:12px;border-radius:10px;background:var(--paper)}
.dials h2{font-family:var(--display);font-size:1.05rem;margin:0}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) 74px;gap:8px;align-items:center}
.row span{color:var(--ink-soft);font-size:13px}
.row input[type=number]{width:100%;font:inherit;font-family:var(--mono);font-size:13px;padding:.25em .4em;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font-variant-numeric:tabular-nums}
.row input[type=range]{width:100%;accent-color:var(--moss)}
.zrow{display:flex;gap:6px;align-items:center;grid-column:2 / 4}
.zrow .btn{white-space:nowrap}
.zrow output{font-family:var(--mono);min-width:2.5em;text-align:center}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .8em;font:inherit;font-size:13px;cursor:pointer}
.btn.primary{background:var(--moss);color:var(--sheet);border-color:var(--moss);font-weight:700}
.btn.warn{color:var(--sel)}
.btn:focus-visible,.chip:focus-visible,.parts button:focus-visible,.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
pre{margin:0;max-height:150px;overflow:auto;background:var(--paper);border-radius:8px;padding:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;user-select:all}
.note{font-size:12px;color:var(--ink-soft);margin:0}
.keys{font-size:12px;color:var(--ink-soft);margin:0;display:grid;gap:2px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--sheet)}
@media (max-width:820px){.bench{grid-template-columns:1fr;height:auto}.stage{height:62vh}}
</style>

<div class="top">
  <h1>리그 조립대</h1>
  <p>부위를 끌어서 옮기고, 다 맞추면 값을 복사해 채팅에 붙여 줘.</p>
</div>
<div class="bench">
  <div class="stage"><canvas id="stage" aria-label="캐릭터 조립 화면" tabindex="0"></canvas>
    <div class="hint" id="hint">부위를 눌러 고르고 끌어서 옮기기 · Shift+끌기로 회전 · 휠로 회전, Shift+휠로 크기</div></div>
  <div class="panel">
    <div><div class="label">방향</div>
      <div class="seg" id="views">
        <button data-view="front" data-flip="0" aria-pressed="true">정면</button>
        <button data-view="side" data-flip="0" aria-pressed="false">오른쪽</button>
        <button data-view="side" data-flip="1" aria-pressed="false">왼쪽</button>
        <button data-view="back" data-flip="0" aria-pressed="false">뒷면</button>
      </div></div>
    <div><div class="label">보기</div>
      <div class="toggles">
        <button class="chip" id="tWalk" aria-pressed="false">걷기 재생</button>
        <button class="chip" id="tGhost" aria-pressed="false">원래 위치 겹쳐 보기</button>
        <button class="chip" id="tZoom" aria-pressed="false">상반신 확대</button>
        <button class="chip" id="tGuide" aria-pressed="true">가이드 선</button>
      </div></div>
    <div><div class="label">부위 (점 = 바꾼 부위)</div><div class="parts" id="parts"></div></div>
    <div class="dials" id="dials">
      <h2 id="selName">목</h2>
      <div class="row"><span>가로</span><input type="range" id="rDx" min="-80" max="80" step="0.5"><input type="number" id="nDx" step="0.5"></div>
      <div class="row"><span>세로</span><input type="range" id="rDy" min="-80" max="80" step="0.5"><input type="number" id="nDy" step="0.5"></div>
      <div class="row"><span>회전°</span><input type="range" id="rRot" min="-60" max="60" step="0.5"><input type="number" id="nRot" step="0.5"></div>
      <div class="row"><span>크기</span><input type="range" id="rS" min="0.6" max="1.6" step="0.01"><input type="number" id="nS" step="0.01"></div>
      <div class="row"><span>앞뒤</span><div class="zrow"><button class="btn" id="zBack">뒤로</button><output id="zOut">0</output><button class="btn" id="zFront">앞으로</button></div></div>
      <div class="actions"><button class="btn" id="resetPart">이 부위 되돌리기</button><button class="btn" id="undo">실행 취소</button></div>
    </div>
    <div><div class="label">결과 값</div>
      <pre id="out"></pre>
      <div class="actions" style="margin-top:8px">
        <button class="btn primary" id="copy">값 복사</button>
        <button class="btn warn" id="resetAll">전체 되돌리기</button>
      </div>
      <p class="note" id="copyNote">세 방향을 다 맞춘 뒤 한 번에 복사해도 돼. 작업은 이 브라우저에 자동 저장돼.</p></div>
    <div class="keys"><span><kbd>←↑→↓</kbd> 1칸 이동 (<kbd>Shift</kbd> 5칸) · <kbd>[</kbd> <kbd>]</kbd> 회전 · <kbd>-</kbd> <kbd>=</kbd> 크기</span><span><kbd>Ctrl</kbd>+<kbd>Z</kbd> 실행 취소</span></div>
  </div>
</div>

<script>
/*__RIG__*/
</script>
<script>
(() => {
const LABELS = {head:"머리",hair:"뒷머리",neck:"목",torso:"몸통",capelet:"어깨 망토",cape:"긴 망토",skirt:"치마",bag:"가방",
  sleeveL:"소매 ◀",forearmL:"아래팔 ◀",sleeveR:"소매 ▶",forearmR:"아래팔 ▶",thighL:"허벅지 ◀",shinL:"부츠 ◀",thighR:"허벅지 ▶",shinR:"부츠 ▶",
  armNear:"앞 팔",armFar:"뒤 팔",thighNear:"앞 허벅지",shinNear:"앞 부츠",thighFar:"뒤 허벅지",shinFar:"뒤 부츠"};
const KEYS = {
  front:["head","hair","neck","torso","capelet","cape","sleeveL","forearmL","sleeveR","forearmR","bag","skirt","thighL","shinL","thighR","shinR"],
  side:["head","hair","neck","torso","capelet","cape","armNear","armFar","bag","skirt","thighNear","shinNear","thighFar","shinFar"],
  back:["head","neck","torso","capelet","cape","sleeveL","forearmL","sleeveR","forearmR","bag","skirt","thighL","shinL","thighR","shinR"]};
const STORE = "bloomodoro-rig-editor-v1";
let adjust = {front:{},side:{},back:{}};
try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && s.front) adjust = s; } catch {}
let view = "front", flip = false, selected = "neck", walking = false, ghost = false, zoom = false, guide = true;
const undoStack = [];
const rig = createAvatarRig({ base: "", onReady: () => paint() });
rig.preload();
const cv = document.getElementById("stage"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
function fit() { const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); paint(); }
new ResizeObserver(fit).observe(cv);

const dirOf = () => view === "front" ? "down" : view === "back" ? "up" : flip ? "left" : "right";
function layout() {
  if (zoom) { const h = H * 1.6; return { x: W / 2, y: H * 0.06 + h, height: h }; }
  const h = H * 0.86; return { x: W / 2, y: H * 0.94, height: h };
}
let phase = 0.25, clock = 0, last = 0;
function poseNow(adj) {
  setRigAdjust(adj);
  const st = { phase, weight: walking ? 1 : 0, time: 0, blink: false, flip };
  return view === "side" ? side(AVATAR_RIG_PARTS.side, st) : frontBack(AVATAR_RIG_PARTS[view], view === "back", st);
}
function rootM() { const L = layout(); const k = L.height / RIG_BODY_HEIGHT[view]; return { k, f: flip ? -1 : 1, m: mul(T(L.x, L.y), S(k * (flip ? -1 : 1), k)) }; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function paint() {
  if (!W) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const L = layout();
  if (guide) {
    ctx.strokeStyle = css("--guide"); ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(L.x + .5, 0); ctx.lineTo(L.x + .5, H); ctx.stroke();
    if (!zoom) { ctx.beginPath(); ctx.moveTo(0, L.y + .5); ctx.lineTo(W, L.y + .5); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  const opts = { x: L.x, y: L.y, height: L.height, direction: dirOf(), phase, weight: walking ? 1 : 0, time: 0, reducedMotion: !walking, expression: "neutral" };
  if (ghost) { setRigAdjust({}); ctx.save(); ctx.globalAlpha = .35; rig.draw(ctx, { ...opts, shadow: false }); ctx.restore(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  setRigAdjust(adjust);
  rig.draw(ctx, opts);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // selection outline + pivot
  const pose = poseNow(adjust), R0 = rootM();
  const it = pose.items.find(i => i[2] === selected);
  if (it) {
    const g = mul(R0.m, it[1]), p = it[0];
    const c = [[0, 0], [p.w, 0], [p.w, p.h], [0, p.h]].map(q => apply(g, q));
    ctx.strokeStyle = css("--sel"); ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); c.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
    const pv = apply(g, p.pivot);
    ctx.fillStyle = css("--sel"); ctx.beginPath(); ctx.arc(pv[0], pv[1], 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}
function loop(t) {
  if (!walking) return;
  const dt = last ? Math.min(.05, (t - last) / 1000) : 0; last = t;
  phase = (phase + dt * 0.9) % 1; paint(); requestAnimationFrame(loop);
}

// ---- hit testing on part alpha
const alphaCache = new Map();
function alphaOf(src) {
  let a = alphaCache.get(src);
  if (a) return a.ready ? a : null;
  a = { ready: false }; alphaCache.set(src, a);
  const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const x = c.getContext("2d"); x.drawImage(im, 0, 0); a.data = x.getImageData(0, 0, c.width, c.height).data; a.w = c.width; a.h = c.height; a.ready = true; };
  im.src = src; return null;
}
function inv(m) { const d = m[0] * m[3] - m[1] * m[2]; return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; }
function hit(x, y) {
  const pose = poseNow(adjust), R0 = rootM();
  for (let i = pose.items.length - 1; i >= 0; i--) {
    const [p, m, key] = pose.items[i];
    if (!key || !KEYS[view].includes(key)) continue;
    const l = apply(inv(mul(R0.m, m)), [x, y]);
    if (l[0] < 0 || l[1] < 0 || l[0] >= p.w || l[1] >= p.h) continue;
    const a = alphaOf(p.src);
    if (!a) return key;
    const sx = Math.floor(l[0] * a.w / p.w), sy = Math.floor(l[1] * a.h / p.h);
    if (a.data[(sy * a.w + sx) * 4 + 3] > 40) return key;
  }
  return null;
}
for (const v of ["front", "side", "back"]) for (const p of Object.values(AVATAR_RIG_PARTS[v])) alphaOf(p.src);

// ---- state helpers
const cur = () => (adjust[view][selected] ||= {});
function snapshot() { undoStack.push(JSON.stringify(adjust)); if (undoStack.length > 200) undoStack.shift(); }
function tidy() {
  for (const v of Object.keys(adjust)) for (const k of Object.keys(adjust[v])) {
    const a = adjust[v][k];
    for (const f of ["dx", "dy", "rot", "z"]) if (!a[f]) delete a[f];
    if (a.s !== undefined && Math.abs(a.s - 1) < 1e-4) delete a.s;
    if (!Object.keys(a).length) delete adjust[v][k];
  }
}
function save() { tidy(); try { localStorage.setItem(STORE, JSON.stringify(adjust)); } catch {} }
const r1 = n => Math.round(n * 10) / 10;
function exportText() {
  tidy();
  const out = {};
  for (const v of ["front", "side", "back"]) { out[v] = {}; for (const [k, a] of Object.entries(adjust[v])) {
    const o = {}; if (a.dx) o.dx = r1(a.dx); if (a.dy) o.dy = r1(a.dy); if (a.rot) o.rot = r1(a.rot);
    if (a.s !== undefined) o.s = Math.round(a.s * 1000) / 1000; if (a.z) o.z = a.z; out[v][k] = o; } }
  return "RIG_ADJUST " + JSON.stringify(out);
}
function sync() {
  save();
  const a = adjust[view][selected] || {};
  document.getElementById("selName").textContent = LABELS[selected] || selected;
  const set = (id, v) => { const el = document.getElementById(id); if (document.activeElement !== el) el.value = v; };
  set("rDx", a.dx || 0); set("nDx", r1(a.dx || 0)); set("rDy", a.dy || 0); set("nDy", r1(a.dy || 0));
  set("rRot", a.rot || 0); set("nRot", r1(a.rot || 0)); set("rS", a.s ?? 1); set("nS", Math.round((a.s ?? 1) * 100) / 100);
  document.getElementById("zOut").textContent = a.z || 0;
  const box = document.getElementById("parts"); box.textContent = "";
  for (const k of KEYS[view]) { const b = document.createElement("button"); b.textContent = LABELS[k]; b.setAttribute("aria-pressed", String(k === selected));
    if (adjust[view][k]) b.classList.add("changed"); b.onclick = () => { selected = k; sync(); }; box.append(b); }
  document.getElementById("out").textContent = exportText();
  paint();
}

// ---- controls
document.querySelectorAll("#views button").forEach(b => b.onclick = () => {
  view = b.dataset.view; flip = b.dataset.flip === "1";
  document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  if (!KEYS[view].includes(selected)) selected = "neck";
  sync();
});
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); fn(on); paint(); }; };
toggle("tWalk", on => { walking = on; last = 0; if (on) requestAnimationFrame(loop); else phase = 0.25; });
toggle("tGhost", on => { ghost = on; });
toggle("tZoom", on => { zoom = on; });
toggle("tGuide", on => { guide = on; });
function bindPair(r, n, field, toNum = parseFloat) {
  const R = document.getElementById(r), N = document.getElementById(n);
  R.addEventListener("pointerdown", snapshot); N.addEventListener("focus", snapshot);
  const on = el => () => { const v = toNum(el.value); if (!Number.isFinite(v)) return; cur()[field] = v; sync(); };
  R.addEventListener("input", on(R)); N.addEventListener("input", on(N));
}
bindPair("rDx", "nDx", "dx"); bindPair("rDy", "nDy", "dy"); bindPair("rRot", "nRot", "rot"); bindPair("rS", "nS", "s");
document.getElementById("zBack").onclick = () => { snapshot(); cur().z = (cur().z || 0) - 1; sync(); };
document.getElementById("zFront").onclick = () => { snapshot(); cur().z = (cur().z || 0) + 1; sync(); };
document.getElementById("resetPart").onclick = () => { snapshot(); delete adjust[view][selected]; sync(); };
function undo() { const s = undoStack.pop(); if (s) { adjust = JSON.parse(s); sync(); } }
document.getElementById("undo").onclick = undo;
const resetAll = document.getElementById("resetAll"); let armed = 0;
resetAll.onclick = () => {
  if (Date.now() - armed > 3000) { armed = Date.now(); resetAll.textContent = "한 번 더 누르면 전부 되돌려"; setTimeout(() => resetAll.textContent = "전체 되돌리기", 3000); return; }
  snapshot(); adjust = { front: {}, side: {}, back: {} }; resetAll.textContent = "전체 되돌리기"; armed = 0; sync();
};
document.getElementById("copy").onclick = async () => {
  const txt = exportText(), note = document.getElementById("copyNote");
  try { await navigator.clipboard.writeText(txt); note.textContent = "복사했어. 채팅에 붙여 넣어 줘."; }
  catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    note.textContent = "자동 복사가 막혀 있어서 글자를 선택해 뒀어. Ctrl+C로 복사해 줘."; }
};

// ---- stage interaction
let drag = null;
function pt(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener("pointerdown", e => {
  const [x, y] = pt(e); const k = hit(x, y);
  if (k) { selected = k; sync(); }
  if (!k && !e.shiftKey) return;
  snapshot();
  const R0 = rootM(), pose = poseNow(adjust), it = pose.items.find(i => i[2] === selected);
  const pv = it ? apply(mul(R0.m, it[1]), it[0].pivot) : [x, y];
  drag = { x, y, a: { ...cur() }, k: R0.k, f: R0.f, rot: e.shiftKey, pv, ang: Math.atan2(y - pv[1], x - pv[0]) };
